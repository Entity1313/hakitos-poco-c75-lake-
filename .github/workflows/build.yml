name: build-lake

# Build the POCO C75 4G / Redmi 14C (lake, MT6768) device side on Apple Silicon:
# the configuration, the kernel (or, without the shared XNU tree, its staged inputs) and
# mtkloader.bin. boot.img is packed only when its two inputs are present; this repository never
# carries an Android boot image or an XNU payload (LEGAL.md).

on:
  push:
    branches: [main, mtk, lake]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-lake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-14 was retired by GitHub ("The configuration 'macos-14-arm64-us-default' is not
    # supported"): a job asking for it is cancelled before it gets a runner. macos-15 is the
    # current stable Apple Silicon image; macos-latest now tracks macos-26.
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        # Nothing Python here needs a third-party package: tools/*.py is stdlib only. The loader
        # needs an ELF linker and macOS has none, so zig supplies `zig ld.lld` (build.sh also
        # accepts a real ld.lld or zig cc). Swift rasterizes the 8x16 font; clang builds the rest.
        run: |
          brew install zig
          clang --version
          swift --version
          python3 --version
          ld.lld --version 2>/dev/null || zig version

      - name: Configure (lake_defconfig)
        run: make lake_defconfig

      - name: Check resolved configuration
        run: make check

      - name: Build kernel
        # The shared XNU tree is not in this repository. When it is checked out (submodule or a
        # path in HAKIOS_KERNEL_TREE), make builds it; otherwise the device drivers and the
        # resolved configuration are staged in build/kernel/ and the step says so.
        env:
          HAKIOS_KERNEL_TREE: ${{ vars.HAKIOS_KERNEL_TREE }}
        run: make kernel

      - name: Build mtkloader
        run: make loader

      - name: Pack boot.img
        # Needs the user's Android boot_a image and an XNU payload; both are deliberately absent
        # from a clean checkout. Provide them as repository files or via a previous job/artifact.
        if: ${{ hashFiles('backup/boot_a_magisk.img') != '' && hashFiles('build-payload.bin') != '' }}
        run: make bootimg

      - name: Show build products
        run: |
          ls -la mtkloader/mtkloader.bin
          ls -la build/boot.img 2>/dev/null || true
          ls -la build/kernel 2>/dev/null || true
          if grep -q HAKIOS_IDENTITY_PLACEHOLDER_H mtkloader/identity.h 2>/dev/null; then
            echo "::warning title=Placeholder identity::mtkloader.bin built without xnuloader/identity.h (no IPSW): not bootable for iOS"
          fi

      - name: Upload mtkloader.bin
        uses: actions/upload-artifact@v4
        with:
          name: lake-mtkloader
          path: mtkloader/mtkloader.bin
          if-no-files-found: error

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: lake-boot-img
          path: build/boot.img
          if-no-files-found: warn

      - name: Upload staged kernel inputs
        uses: actions/upload-artifact@v4
        with:
          name: lake-kernel-stage
          path: build/kernel/
          if-no-files-found: warn
